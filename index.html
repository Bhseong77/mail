<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENJET 팀 메일 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080810; --bg2:#0f0f1a; --bg3:#161625; --bg4:#1e1e30;
  --border:#252538; --accent:#5b8fff; --accent2:#8b5cf6;
  --text:#e2e2f0; --t2:#7878a0; --t3:#404060;
  --green:#10b981; --red:#ef4444; --yellow:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
body::before{content:'';position:fixed;top:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(91,143,255,0.05) 0%,transparent 70%);pointer-events:none;z-index:0;}

/* Login */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:20px;}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:36px 40px;text-align:center;max-width:380px;width:90%;}
.login-logo{width:56px;height:56px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;}
.login-box h1{font-size:20px;font-weight:700;margin-bottom:6px;}
.login-box p{font-size:13px;color:var(--t2);margin-bottom:24px;line-height:1.6;}
.login-btn{width:100%;padding:12px;background:var(--accent);border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:600;font-family:'Pretendard',sans-serif;cursor:pointer;transition:background 0.15s;}
.login-btn:hover{background:#4a7eee;}
.login-footer{font-size:11px;color:var(--t3);margin-top:12px;}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;gap:10px;flex-wrap:wrap;position:relative;z-index:10;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-box{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.logo h1{font-size:14px;font-weight:700;}
.logo span{font-size:11px;color:var(--t2);}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.status-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);background:var(--bg3);border:1px solid var(--border);padding:5px 10px;border-radius:20px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
.dot.err{background:var(--red);animation:none;}
.dot.spin{background:var(--yellow);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.user-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);background:var(--bg3);border:1px solid var(--border);padding:5px 10px;border-radius:20px;}
.btn{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:12px;font-family:'Pretendard',sans-serif;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.danger:hover{border-color:var(--red);color:var(--red);}

/* App layout */
.app{display:grid;grid-template-columns:200px 320px 1fr;flex:1;overflow:hidden;position:relative;z-index:1;}

/* Sidebar */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.sb-section{padding:10px 0;border-bottom:1px solid var(--border);}
.sb-label{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:1px;padding:0 12px 7px;}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:all 0.1s;border-left:2px solid transparent;font-size:12px;color:var(--t2);}
.sb-item:hover{background:var(--bg3);color:var(--text);}
.sb-item.active{background:rgba(91,143,255,0.08);border-left-color:var(--accent);color:var(--text);}
.sb-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.sb-info{flex:1;min-width:0;}
.sb-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-mail{font-size:10px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-cnt{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--t2);background:var(--bg4);padding:2px 6px;border-radius:4px;flex-shrink:0;}
.av0{background:rgba(91,143,255,0.18);color:#5b8fff;}
.av1{background:rgba(139,92,246,0.18);color:#8b5cf6;}
.av2{background:rgba(6,182,212,0.18);color:#06b6d4;}
.av3{background:rgba(16,185,129,0.18);color:#10b981;}
.av4{background:rgba(245,158,11,0.18);color:#f59e0b;}

/* Mail list */
.ml-panel{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--bg2);}
.ph{padding:11px 13px;border-bottom:1px solid var(--border);background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.ph-title{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:0.8px;}
.ph-cnt{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--t2);}
.sw{padding:9px 11px;border-bottom:1px solid var(--border);flex-shrink:0;}
.si{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:12px;font-family:'Pretendard',sans-serif;outline:none;transition:border-color 0.15s;}
.si:focus{border-color:var(--accent);}
.si::placeholder{color:var(--t2);}
.tab-bar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg3);}
.tab-item{flex:1;padding:8px 6px;text-align:center;font-size:11px;font-weight:500;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;}
.tab-item:hover{color:var(--text);}
.tab-item.active{color:var(--accent);border-bottom-color:var(--accent);}
.mail-scroll{overflow-y:auto;flex:1;}
.mail-scroll::-webkit-scrollbar{width:3px;}
.mail-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.mi{padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;border-left:2px solid transparent;}
.mi:hover{background:var(--bg3);}
.mi.active{background:rgba(91,143,255,0.07);border-left-color:var(--accent);}
.mi-top{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:3px;}
.mi-sender{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.mi-date{font-size:10px;color:var(--t2);font-family:'JetBrains Mono',monospace;flex-shrink:0;}
.mi-subj{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.mi-prev{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mi-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.tag{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:500;}
.tag.att{background:rgba(245,158,11,0.12);color:var(--yellow);}
.tag.own{font-size:9px;background:rgba(91,143,255,0.12);color:var(--accent);}

/* Detail */
.dp{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.dp-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--t2);}
.dp-empty-icon{font-size:40px;opacity:0.2;}
.dp-inner{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.dp-head{padding:16px 18px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.dp-subj{font-size:15px;font-weight:600;margin-bottom:11px;line-height:1.4;}
.meta-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px;}
.mk{color:var(--t2);white-space:nowrap;}
.mv{color:var(--text);word-break:break-all;}
.dp-body-wrap{flex:1;overflow-y:auto;padding:16px 18px;}
.dp-body-wrap::-webkit-scrollbar{width:4px;}
.dp-body-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.dp-body{font-size:13px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word;}
.att-sec{padding:12px 18px;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.att-title{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:7px;}
.att-item{display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;font-size:12px;}

/* Table */
.tbl-panel{display:none;flex:1;flex-direction:column;overflow:hidden;}
.tbl-toolbar{padding:8px 11px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;background:var(--bg3);flex-shrink:0;}
.tw{overflow:auto;flex:1;}
.tw::-webkit-scrollbar{width:4px;height:4px;}
.tw::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{background:var(--bg3);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
th{padding:8px 11px;text-align:left;font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:0.7px;cursor:pointer;white-space:nowrap;user-select:none;}
th:hover{color:var(--accent);}
th.asc::after{content:' ▲';color:var(--accent);}
th.desc::after{content:' ▼';color:var(--accent);}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.1s;cursor:pointer;}
tbody tr:hover{background:var(--bg3);}
td{padding:7px 11px;color:var(--text);vertical-align:middle;}
.td-m{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t2);white-space:nowrap;}
.td-t{max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.td-s{font-size:11px;color:var(--t2);}
.exp-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--t2);font-size:11px;font-family:'Pretendard',sans-serif;cursor:pointer;transition:all 0.15s;}
.exp-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Loading */
.lb{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:12px;color:var(--t2);font-size:13px;}
.spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Progress */
.progress-bar{height:3px;background:var(--border);flex-shrink:0;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.3s;width:0%;}
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">📧</div>
    <h1>ENJET 팀 메일 대시보드</h1>
    <p>SharePoint 메일 백업 연동<br>ENJET 조직 계정으로 로그인하세요</p>
    <button class="login-btn" onclick="doLogin()">🔐 Microsoft 계정으로 로그인</button>
    <div class="login-footer">🔒 ENJET 조직 계정만 접근 가능</div>
  </div>
</div>

<!-- Header -->
<div class="header" id="mainHeader" style="display:none;">
  <div class="logo">
    <div class="logo-box">📧</div>
    <div>
      <h1>ENJET 팀 메일 대시보드</h1>
      <span>SharePoint 백업 연동</span>
    </div>
  </div>
  <div class="hright">
    <div class="status-pill">
      <div class="dot" id="statusDot"></div>
      <span id="statusTxt">초기화 중...</span>
    </div>
    <div class="user-badge">👤 <span id="userNameBadge"></span></div>
    <button class="btn" onclick="loadAll()">🔄 새로고침</button>
    <button class="btn danger" onclick="doLogout()">로그아웃</button>
  </div>
</div>
<div class="progress-bar" id="mainProgress" style="display:none;"><div class="progress-fill" id="progressFill"></div></div>

<!-- App -->
<div class="app" id="mainApp" style="display:none;">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sb-section">
      <div class="sb-label">메일함</div>
      <div class="sb-item active" onclick="selectOwner('all')" id="nav-all">
        <div class="sb-av av0" style="font-size:14px;">👥</div>
        <div class="sb-info">
          <div class="sb-name">전체 보기</div>
          <div class="sb-mail">모든 팀원</div>
        </div>
        <div class="sb-cnt" id="cnt-all">0</div>
      </div>
    </div>
    <div class="sb-section">
      <div class="sb-label">팀원</div>
      <div id="memberList"></div>
    </div>
  </div>

  <!-- Mail list panel -->
  <div class="ml-panel">
    <div class="ph">
      <span class="ph-title" id="panelTitle">받은 메일함</span>
      <span class="ph-cnt" id="panelCount"></span>
    </div>
    <div class="sw">
      <input class="si" id="searchInput" placeholder="🔍 제목, 발신자 검색..." oninput="filterMails()">
    </div>
    <div class="tab-bar">
      <div class="tab-item active" onclick="switchTab('list',this)">메일함</div>
      <div class="tab-item" onclick="switchTab('table',this)">목록</div>
    </div>

    <!-- List -->
    <div id="tabList" class="mail-scroll">
      <div class="lb"><div class="spinner"></div>로그인 후 로딩됩니다</div>
    </div>

    <!-- Table -->
    <div class="tbl-panel" id="tabTable">
      <div class="tbl-toolbar">
        <span style="font-size:11px;color:var(--t2);flex:1" id="tblCount"></span>
        <button class="exp-btn" onclick="exportCSV()">⬇️ CSV 내보내기</button>
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th onclick="sortTbl('date')">날짜</th>
              <th onclick="sortTbl('owner')">메일함</th>
              <th onclick="sortTbl('sender')">발신자</th>
              <th onclick="sortTbl('senderEmail')">발신 이메일</th>
              <th onclick="sortTbl('subject')">제목</th>
              <th>참조자 이름</th>
              <th>참조자 이메일</th>
              <th>첨부</th>
            </tr>
          </thead>
          <tbody id="tblBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Detail -->
  <div class="dp">
    <div class="dp-empty" id="dpEmpty">
      <div class="dp-empty-icon">✉️</div>
      <div style="font-size:13px;color:var(--t2)">메일을 선택하세요</div>
    </div>
    <div class="dp-inner" id="dpInner" style="display:none;">
      <div class="dp-head">
        <div class="dp-subj" id="dSubj"></div>
        <div class="meta-grid">
          <span class="mk">메일함</span><span class="mv" id="dOwner"></span>
          <span class="mk">보낸 이</span><span class="mv" id="dFrom"></span>
          <span class="mk">받는 이</span><span class="mv" id="dTo"></span>
          <span class="mk" id="dCcK" style="display:none">참 조</span>
          <span class="mv" id="dCc" style="display:none"></span>
          <span class="mk">날 짜</span><span class="mv" id="dDate"></span>
        </div>
      </div>
      <div class="dp-body-wrap"><div class="dp-body" id="dBody"></div></div>
      <div class="att-sec" id="dAttSec" style="display:none;">
        <div class="att-title">📎 첨부파일</div>
        <div id="dAttList"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Config ─────────────────────────────────────────
const MSAL_CLIENT_ID = "76793776-3330-496f-97f1-9f0c034f3f07";
const MSAL_TENANT_ID = "58b310e1-9278-47ab-8e49-792728818c9e";
const SP_HOST        = "enjetco.sharepoint.com";
const SP_SITE_PATH   = "/sites/06.BackOffice";
const MAIL_FOLDER    = "📦영업/10.mail_backup";

const SCOPES = ["User.Read","Files.Read.All","Sites.Read.All"];

const MEMBERS = [
  { email: "kwkang@enjet.co.kr",   name: "강경원" },
  { email: "baekhoon@enjet.co.kr", name: "성백훈" },
];

// ── State ───────────────────────────────────────────
let msal_, acct, siteId, driveId;
let allMails = [], filtered = [];
let currentOwner = "all", currentTab = "list";
let sortKey = "date", sortDir = "desc";

// ── MSAL Init ───────────────────────────────────────
window.onload = async () => {
  msal_ = new msal.PublicClientApplication({
    auth: {
      clientId: MSAL_CLIENT_ID,
      authority: "https://login.microsoftonline.com/" + MSAL_TENANT_ID,
      redirectUri: location.href.split("?")[0].split("#")[0]
    },
    cache: { cacheLocation: "localStorage" }
  });
  await msal_.initialize();
  const accounts = msal_.getAllAccounts();
  if (accounts.length > 0) {
    acct = accounts[0];
    showApp();
    loadAll();
  }
  renderMemberList();
};

async function doLogin() {
  try {
    const r = await msal_.loginPopup({ scopes: SCOPES, prompt: "select_account" });
    acct = r.account;
    showApp();
    loadAll();
  } catch(e) {
    alert("로그인 실패: " + e.message);
  }
}

function doLogout() {
  msal_.logoutPopup({ account: acct });
  acct = null;
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("mainHeader").style.display = "none";
  document.getElementById("mainApp").style.display = "none";
  document.getElementById("mainProgress").style.display = "none";
}

function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainHeader").style.display = "flex";
  document.getElementById("mainApp").style.display = "grid";
  document.getElementById("mainProgress").style.display = "block";
  document.getElementById("userNameBadge").textContent = acct?.name || acct?.username || "";
}

async function getToken() {
  try {
    const r = await msal_.acquireTokenSilent({ scopes: SCOPES, account: acct });
    return r.accessToken;
  } catch(e) {
    const r = await msal_.acquireTokenPopup({ scopes: SCOPES });
    return r.accessToken;
  }
}

// ── Graph API ───────────────────────────────────────
async function gFetch(token, path) {
  const r = await fetch("https://graph.microsoft.com/v1.0" + path, {
    headers: { Authorization: "Bearer " + token }
  });
  if (!r.ok) throw new Error(`Graph 오류 ${r.status}: ${path}`);
  return r.json();
}

async function gFetchBinary(token, path) {
  const r = await fetch("https://graph.microsoft.com/v1.0" + path, {
    headers: { Authorization: "Bearer " + token }
  });
  if (!r.ok) throw new Error(`파일 읽기 실패 ${r.status}`);
  return r.arrayBuffer();
}

async function initSite(token) {
  if (siteId && driveId) return;
  const site = await gFetch(token, `/sites/${SP_HOST}:${SP_SITE_PATH}`);
  siteId = site.id;
  const drives = await gFetch(token, `/sites/${siteId}/drives`);
  const drive = drives.value.find(d => d.driveType === "documentLibrary");
  if (!drive) throw new Error("문서 라이브러리를 찾을 수 없습니다");
  driveId = drive.id;
}

async function listFolder(token, folderPath) {
  const enc = encodeURIComponent(folderPath);
  const data = await gFetch(token, `/drives/${driveId}/root:/${enc}:/children?$top=5000`);
  return data.value || [];
}

async function getFileText(token, filePath) {
  const enc = encodeURIComponent(filePath);
  const buf = await gFetchBinary(token, `/drives/${driveId}/root:/${enc}:/content`);
  return new TextDecoder("utf-8", { fatal: false }).decode(buf);
}

// ── EML Parser ──────────────────────────────────────
function decodeWord(str) {
  if (!str) return "";
  return str.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (_, cs, enc, txt) => {
    try {
      if (enc.toUpperCase() === "B") {
        return new TextDecoder(cs).decode(Uint8Array.from(atob(txt), c => c.charCodeAt(0)));
      } else {
        const d = txt.replace(/_/g," ").replace(/=([0-9A-Fa-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
        return new TextDecoder(cs).decode(Uint8Array.from(d, c => c.charCodeAt(0)));
      }
    } catch { return txt; }
  });
}

function parseAddrs(str) {
  if (!str) return [];
  return str.split(",").map(p => {
    p = p.trim();
    const m = p.match(/^"?([^"<]*)"?\s*<?([^>]*)>?$/);
    if (!m) return { name: "", email: p };
    return { name: decodeWord(m[1].trim()), email: m[2].trim() };
  }).filter(x => x.email || x.name);
}

function parseEml(text) {
  const lines = text.split(/\r?\n/);
  const headers = {};
  let i = 0;
  while (i < lines.length && lines[i] !== "") {
    const line = lines[i];
    if (/^\s/.test(line)) {
      const keys = Object.keys(headers);
      if (keys.length) headers[keys[keys.length-1]] += " " + line.trim();
    } else {
      const col = line.indexOf(":");
      if (col > 0) {
        const k = line.slice(0,col).toLowerCase().trim();
        headers[k] = line.slice(col+1).trim();
      }
    }
    i++;
  }

  const subject = decodeWord(headers["subject"] || "");
  const from    = decodeWord(headers["from"] || "");
  const to      = decodeWord(headers["to"] || "");
  const cc      = decodeWord(headers["cc"] || "");
  const dateRaw = headers["date"] || "";

  let dateFmt = dateRaw;
  try {
    const d = new Date(dateRaw);
    if (!isNaN(d)) dateFmt = d.toLocaleString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  } catch {}

  // Body extraction
  const bStart = lines.findIndex((l, idx) => idx > 0 && l === "") + 1;
  let body = lines.slice(bStart, bStart + 120).join("\n");
  body = body.replace(/=\r?\n/g,"").replace(/=[0-9A-Fa-f]{2}/g, m => String.fromCharCode(parseInt(m.slice(1),16)));
  if (/<html|<HTML|<body|<div/i.test(body)) {
    body = body.replace(/<style[^>]*>[\s\S]*?<\/style>/gi,"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  }

  // Attachments
  const attachments = [];
  const full = lines.join("\n");
  for (const m of full.matchAll(/Content-Disposition:\s*attachment[^\n]*(?:\r?\n[ \t]+[^\n]*)*/gi)) {
    const fn = m[0].match(/filename[*]?\s*=\s*"?([^";\r\n]+)"?/i);
    if (fn) attachments.push(decodeWord(fn[1].trim()));
  }

  return { subject, from, to: parseAddrs(to), cc: parseAddrs(cc), date: dateFmt, dateRaw, body: body.slice(0,800), hasAttachment: attachments.length > 0, attachments };
}

// ── Load all ────────────────────────────────────────
async function loadAll() {
  setStatus("연결 중...", "spin");
  setProgress(0);
  document.getElementById("tabList").innerHTML = '<div class="lb"><div class="spinner"></div>SharePoint 연결 중...</div>';
  allMails = [];

  try {
    const token = await getToken();
    await initSite(token);
    setProgress(10);

    let totalFiles = 0;
    // Count files first
    for (const m of MEMBERS) {
      try {
        const files = await listFolder(token, `${MAIL_FOLDER}/${m.email}`);
        totalFiles += files.filter(f => f.name?.toLowerCase().endsWith(".eml")).length;
      } catch {}
    }

    let loaded = 0;
    for (let mi = 0; mi < MEMBERS.length; mi++) {
      const member = MEMBERS[mi];
      const folderPath = `${MAIL_FOLDER}/${member.email}`;
      setStatus(`${member.name} 로딩 중...`, "spin");

      try {
        const files = await listFolder(token, folderPath);
        const emls = files.filter(f => f.name?.toLowerCase().endsWith(".eml"));

        const BATCH = 15;
        for (let b = 0; b < emls.length; b += BATCH) {
          const batch = emls.slice(b, b + BATCH);
          await Promise.all(batch.map(async file => {
            try {
              const text = await getFileText(token, `${folderPath}/${file.name}`);
              const parsed = parseEml(text);
              allMails.push({ ...parsed, owner: member.email, ownerName: member.name, fileName: file.name });
            } catch {}
            loaded++;
            setProgress(10 + Math.round(loaded / totalFiles * 85));
            document.getElementById("tabList").innerHTML =
              `<div class="lb"><div class="spinner"></div>${member.name}: ${loaded}/${totalFiles}개 로딩 중...</div>`;
          }));
        }
      } catch(e) {
        console.warn(member.email, e.message);
      }
    }

    allMails.sort((a,b) => new Date(b.dateRaw||0) - new Date(a.dateRaw||0));
    filtered = [...allMails];
    updateCounts();
    filterMails();
    setStatus(`연결됨 · ${allMails.length}통`, "ok");
    setProgress(100);
    setTimeout(() => setProgress(0), 1500);

  } catch(e) {
    setStatus("오류: " + e.message, "err");
    document.getElementById("tabList").innerHTML =
      `<div class="lb" style="color:var(--red)">⚠️ ${esc(e.message)}</div>`;
  }
}

// ── Counts ──────────────────────────────────────────
function updateCounts() {
  document.getElementById("cnt-all").textContent = allMails.length;
  MEMBERS.forEach(m => {
    const el = document.getElementById("cnt-" + m.email);
    if (el) el.textContent = allMails.filter(x => x.owner === m.email).length;
  });
}

// ── Render members ───────────────────────────────────
function renderMemberList() {
  document.getElementById("memberList").innerHTML = MEMBERS.map((m, i) => `
    <div class="sb-item" onclick="selectOwner('${m.email}')" id="nav-${m.email}">
      <div class="sb-av av${i%5}">${m.name[0]}</div>
      <div class="sb-info">
        <div class="sb-name">${m.name}</div>
        <div class="sb-mail">${m.email}</div>
      </div>
      <div class="sb-cnt" id="cnt-${m.email}">0</div>
    </div>`).join("");
}

// ── Select owner ─────────────────────────────────────
function selectOwner(owner) {
  currentOwner = owner;
  document.querySelectorAll(".sb-item").forEach(el => el.classList.remove("active"));
  const nav = document.getElementById("nav-" + owner);
  if (nav) nav.classList.add("active");
  const m = MEMBERS.find(x => x.email === owner);
  document.getElementById("panelTitle").textContent = owner === "all" ? "전체 보기" : (m?.name || owner);
  filterMails();
}

// ── Filter ───────────────────────────────────────────
function filterMails() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  filtered = allMails.filter(m => {
    const ownerOk = currentOwner === "all" || m.owner === currentOwner;
    const searchOk = !q || (m.subject||"").toLowerCase().includes(q) || (m.from||"").toLowerCase().includes(q);
    return ownerOk && searchOk;
  });
  document.getElementById("panelCount").textContent = filtered.length + "통";
  if (currentTab === "list") renderList(filtered);
  else renderTable(filtered);
}

// ── Render list ──────────────────────────────────────
function renderList(mails) {
  const el = document.getElementById("tabList");
  if (!mails.length) { el.innerHTML = '<div class="lb">📭 메일이 없습니다</div>'; return; }
  el.innerHTML = mails.map(mail => {
    const idx = allMails.indexOf(mail);
    return `<div class="mi" onclick="showDetail(${idx})" id="mi-${idx}">
      <div class="mi-top">
        <span class="mi-sender">${esc(extractName(mail.from))}</span>
        <span class="mi-date">${(mail.date||"").slice(0,10)}</span>
      </div>
      <div class="mi-subj">${esc(mail.subject||"(제목 없음)")}</div>
      <div class="mi-prev">${esc((mail.body||"").slice(0,60))}</div>
      <div class="mi-tags">
        ${currentOwner==="all"?`<span class="tag own">${esc(mail.ownerName)}</span>`:""}
        ${mail.hasAttachment?'<span class="tag att">📎 첨부</span>':""}
      </div>
    </div>`;
  }).join("");
}

// ── Render table ─────────────────────────────────────
function renderTable(mails) {
  document.getElementById("tblCount").textContent = mails.length + "개";
  const tbody = document.getElementById("tblBody");
  if (!mails.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--t2)">📭 없음</td></tr>';
    return;
  }
  tbody.innerHTML = mails.map(mail => {
    const idx = allMails.indexOf(mail);
    const ccN = (mail.cc||[]).map(c=>c.name||c.email).join("; ");
    const ccE = (mail.cc||[]).map(c=>c.email).join("; ");
    return `<tr onclick="showDetail(${idx})">
      <td class="td-m">${esc((mail.date||"").slice(0,16))}</td>
      <td class="td-s">${esc(mail.ownerName)}</td>
      <td>${esc(extractName(mail.from))}</td>
      <td class="td-s">${esc(extractEmail(mail.from))}</td>
      <td><span class="td-t" title="${esc(mail.subject||"")}">${esc(mail.subject||"(제목없음)")}</span></td>
      <td class="td-s td-t">${esc(ccN)}</td>
      <td class="td-s td-t">${esc(ccE)}</td>
      <td>${mail.hasAttachment?"📎":""}</td>
    </tr>`;
  }).join("");
}

// ── Show detail ──────────────────────────────────────
function showDetail(idx) {
  const mail = allMails[idx];
  if (!mail) return;
  document.querySelectorAll(".mi").forEach(el => el.classList.remove("active"));
  const el = document.getElementById("mi-"+idx);
  if (el) { el.classList.add("active"); el.scrollIntoView({block:"nearest"}); }

  document.getElementById("dpEmpty").style.display = "none";
  document.getElementById("dpInner").style.display = "flex";

  document.getElementById("dSubj").textContent = mail.subject || "(제목 없음)";
  document.getElementById("dOwner").textContent = `${mail.ownerName} (${mail.owner})`;
  document.getElementById("dFrom").textContent = mail.from;
  document.getElementById("dTo").textContent = (mail.to||[]).map(t=>t.name?`${t.name} <${t.email}>`:t.email).join(", ")||"-";
  document.getElementById("dDate").textContent = mail.date;

  const ccEl = document.getElementById("dCc"), ccK = document.getElementById("dCcK");
  if (mail.cc?.length) {
    ccEl.textContent = mail.cc.map(c=>c.name?`${c.name} <${c.email}>`:c.email).join(", ");
    ccEl.style.display = ""; ccK.style.display = "";
  } else { ccEl.style.display = "none"; ccK.style.display = "none"; }

  document.getElementById("dBody").textContent = mail.body || "(본문 없음)";

  const attSec = document.getElementById("dAttSec");
  if (mail.hasAttachment && mail.attachments?.length) {
    attSec.style.display = "block";
    document.getElementById("dAttList").innerHTML = mail.attachments.map(f =>
      `<div class="att-item">📄 ${esc(f)}</div>`).join("");
  } else { attSec.style.display = "none"; }
}

// ── Tab switch ───────────────────────────────────────
function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll(".tab-item").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  const listEl = document.getElementById("tabList");
  const tblEl  = document.getElementById("tabTable");
  if (tab === "list") {
    listEl.style.display = ""; tblEl.style.display = "none"; renderList(filtered);
  } else {
    listEl.style.display = "none"; tblEl.style.display = "flex"; tblEl.style.flexDirection = "column"; renderTable(filtered);
  }
}

// ── Sort table ───────────────────────────────────────
function sortTbl(key) {
  if (sortKey===key) sortDir = sortDir==="asc"?"desc":"asc"; else { sortKey=key; sortDir="asc"; }
  document.querySelectorAll("th").forEach(t=>t.classList.remove("asc","desc"));
  const map={date:0,owner:1,sender:2,senderEmail:3,subject:4};
  const ths = document.querySelectorAll("#tabTable thead th");
  if (ths[map[key]]) ths[map[key]].classList.add(sortDir==="asc"?"asc":"desc");
  filtered.sort((a,b)=>{
    let va="",vb="";
    if(key==="date"){va=a.dateRaw||"";vb=b.dateRaw||"";}
    else if(key==="owner"){va=a.ownerName||"";vb=b.ownerName||"";}
    else if(key==="sender"){va=extractName(a.from);vb=extractName(b.from);}
    else if(key==="senderEmail"){va=extractEmail(a.from);vb=extractEmail(b.from);}
    else if(key==="subject"){va=a.subject||"";vb=b.subject||"";}
    return sortDir==="asc"?va.localeCompare(vb,"ko"):vb.localeCompare(va,"ko");
  });
  renderTable(filtered);
}

// ── Export CSV ───────────────────────────────────────
function exportCSV() {
  const rows=[["날짜","메일함","발신자이름","발신자이메일","제목","참조자이름","참조자이메일","첨부파일"]];
  filtered.forEach(m=>{
    rows.push([m.date||"",m.ownerName||"",extractName(m.from),extractEmail(m.from),
      m.subject||"",(m.cc||[]).map(c=>c.name||c.email).join(";"),
      (m.cc||[]).map(c=>c.email).join(";"),(m.attachments||[]).join(";")]);
  });
  const csv=rows.map(r=>r.map(c=>`"${(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
  a.download="enjet_team_mail_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
}

// ── Utils ────────────────────────────────────────────
function setStatus(txt, state) {
  document.getElementById("statusTxt").textContent = txt;
  const d = document.getElementById("statusDot");
  d.className = "dot" + (state==="err"?" err":state==="spin"?" spin":"");
}
function setProgress(pct) {
  document.getElementById("progressFill").style.width = (pct||0) + "%";
}
function extractName(from) {
  const m=(from||"").match(/^"?([^"<]+)"?\s*</);
  return m?m[1].trim():(from||"").split("@")[0];
}
function extractEmail(from) {
  const m=(from||"").match(/<([^>]+)>/);
  if(m) return m[1];
  if((from||"").includes("@")) return (from||"").trim();
  return from||"";
}
function esc(s) { return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
