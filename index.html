<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENJET · 기술자료</title>

<!-- Pretendard -->
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<!-- MSAL (Microsoft Graph 위임 로그인) -->
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

<style>
  :root {
    --brand-1: #2c5fb3;
    --brand-2: #4a86e8;
    --brand-grad: linear-gradient(135deg, #2c5fb3 0%, #4a86e8 100%);
    --bg: #f5f7fb;
    --panel: #ffffff;
    --line: #e6ebf3;
    --text: #1f2a44;
    --muted: #7a87a3;
    --hover: #eef3fc;
    --sel: #dbe7fb;
    --danger: #c0392b;
    --radius: 10px;
    --shadow: 0 4px 14px rgba(31, 42, 68, .08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }

  /* ===== 상단 탭 ===== */
  .topbar {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 14px;
    height: 50px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .tab {
    padding: 14px 14px;
    color: var(--muted);
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    user-select: none;
  }
  .tab.active { color: var(--brand-1); border-bottom-color: var(--brand-1); }
  .tab:hover { color: var(--brand-1); }

  /* ===== 본문 ===== */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .header .spacer { flex: 1; }
  .search {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    width: 260px;
    font-size: 13px;
    outline: none;
  }
  .search:focus { border-color: var(--brand-2); }
  .btn {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--brand-grad); color: #fff; border: none; }

  .layout { display: flex; height: calc(100vh - 50px - 65px); }

  /* 왼쪽 트리 */
  .tree {
    width: 46%;
    min-width: 380px;
    overflow: auto;
    border-right: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 6px;
  }
  .node { user-select: none; }
  .row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .row:hover { background: var(--hover); }
  .row.selected { background: var(--sel); font-weight: 600; color: var(--brand-1); }
  .caret { width: 14px; text-align: center; color: var(--muted); font-size: 11px; }
  .caret.empty { visibility: hidden; }
  .icon { width: 16px; text-align: center; }
  .children { padding-left: 18px; }
  .label { overflow: hidden; text-overflow: ellipsis; }

  /* 오른쪽 미리보기 */
  .preview {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 12px;
  }
  .preview .eye { font-size: 40px; opacity: .35; }
  .preview iframe { width: 100%; height: 100%; border: 0; }

  /* 컨텍스트 메뉴 */
  .ctx {
    position: fixed;
    z-index: 1000;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    min-width: 180px;
    padding: 6px;
    display: none;
  }
  .ctx button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: 0;
    background: none;
    text-align: left;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    font-family: inherit;
  }
  .ctx button:hover { background: var(--hover); }
  .ctx .sep { height: 1px; background: var(--line); margin: 6px 4px; }

  /* 로그인 게이트 */
  .gate {
    height: calc(100vh - 50px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .gate .logo { font-size: 22px; font-weight: 800; color: var(--brand-1); }

  /* 토스트 */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--brand-1);
    color: #fff;
    padding: 11px 18px;
    border-radius: 9px;
    font-size: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.22);
    z-index: 2000;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }

  .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<!-- 상단 탭 -->
<nav class="topbar" id="topbar">
  <div class="tab">📧 메일</div>
  <div class="tab">👥 주소록</div>
  <div class="tab">📄 견적서</div>
  <div class="tab">📑 거래명세서</div>
  <div class="tab">🧾 세금계산서</div>
  <div class="tab active">📚 기술자료</div>
  <div class="tab">📎 팀즈첨부파일정리</div>
  <div class="tab">📧 이메일첨부파일정리</div>
  <div class="tab">📅 통합일정관리</div>
  <div class="tab">🛒 구매</div>
</nav>

<!-- 로그인 전 -->
<div class="gate" id="gate">
  <div class="logo">ENJET · 기술자료</div>
  <div class="hint">Microsoft 365 계정으로 로그인하면 SharePoint 문서함이 열립니다.</div>
  <button class="btn primary" id="loginBtn">Microsoft 계정으로 로그인</button>
</div>

<!-- 로그인 후 본문 -->
<main id="app" style="display:none">
  <div class="header">
    <h1>📚 기술자료</h1>
    <div class="spacer"></div>
    <input class="search" id="search" placeholder="🔍 파일 검색" />
    <button class="btn" id="refreshBtn">↻ 새로고침</button>
    <button class="btn" id="logoutBtn">로그아웃</button>
  </div>

  <div class="layout">
    <div class="tree" id="tree"></div>
    <div class="preview" id="preview">
      <div class="eye">👁</div>
      <div>파일을 클릭하면 여기에서 탭으로 열립니다</div>
    </div>
  </div>
</main>

<!-- 우클릭 컨텍스트 메뉴 -->
<div class="ctx" id="ctx">
  <button data-act="mail">✉️ 첨부해서 새 메일</button>
  <button data-act="download">⬇️ 다운로드</button>
  <button data-act="copylink">🔗 링크복사(내부)</button>
  <div class="sep"></div>
  <button data-act="newfolder">📁 새 폴더</button>
  <button data-act="upload">⬆️ 여기에 업로드</button>
  <button data-act="rename">✏️ 이름 변경</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1) 설정  ── 환경에 맞게만 채워주세요
   ========================================================= */
const CONFIG = {
  clientId: "76793776-3330-496f-97f1-9f0c034f3f07",
  tenantId: "58b310e1-9278-47ab-8e49-792728818c9e",
  // 위임 권한: 파일/사이트 읽기. 쓰기(업로드/이름변경)까지 쓰려면 .ReadWrite.All 로.
  scopes: ["Files.Read.All", "Sites.Read.All", "User.Read"],

  // ── SharePoint 문서함 위치 ──
  // 방법 A) 사이트 호스트 + 경로로 지정 (가장 직관적)
  siteHostname: "enjet.sharepoint.com",          // 테넌트 SharePoint 호스트
  sitePath: "/sites/기술자료",                    // 대상 사이트 경로
  // 표시 시작 폴더(루트면 비워두기). 예: "03.내부공유"
  rootFolderPath: ""
};

const GRAPH = "https://graph.microsoft.com/v1.0";

/* =========================================================
   2) MSAL 로그인
   ========================================================= */
const msal = new msal_browser.PublicClientApplication({
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: window.location.origin + window.location.pathname
  },
  cache: { cacheLocation: "sessionStorage" }
});

let account = null;
let driveId = null;

async function getToken() {
  const req = { scopes: CONFIG.scopes, account };
  try {
    const r = await msal.acquireTokenSilent(req);
    return r.accessToken;
  } catch (e) {
    const r = await msal.acquireTokenPopup(req);
    return r.accessToken;
  }
}

async function graph(path, opts = {}) {
  const token = await getToken();
  const res = await fetch(GRAPH + path, {
    ...opts,
    headers: {
      Authorization: "Bearer " + token,
      "Content-Type": "application/json",
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`Graph ${res.status}: ${txt}`);
  }
  return res.status === 204 ? null : res.json();
}

/* =========================================================
   3) SharePoint drive 해석 + 폴더 로드
   ========================================================= */
async function resolveDrive() {
  // 사이트 → 기본 문서 라이브러리(drive) id
  const site = await graph(
    `/sites/${CONFIG.siteHostname}:${CONFIG.sitePath}`
  );
  const drive = await graph(`/sites/${site.id}/drive`);
  driveId = drive.id;
}

// webUrl, file/folder 필드를 반드시 받아옴 (링크복사에 webUrl 필요)
const SELECT = "$select=id,name,webUrl,folder,file,size,parentReference";

async function listChildren(itemId) {
  const base = itemId
    ? `/drives/${driveId}/items/${itemId}/children`
    : `/drives/${driveId}/root/children`;
  const data = await graph(`${base}?${SELECT}&$top=200`);
  return data.value;
}

/* =========================================================
   4) 트리 렌더링
   ========================================================= */
const treeEl = document.getElementById("tree");
let selectedItem = null;

function makeRow(item) {
  const node = document.createElement("div");
  node.className = "node";

  const row = document.createElement("div");
  row.className = "row";
  row.dataset.id = item.id;

  const isFolder = !!item.folder;
  const caret = document.createElement("span");
  caret.className = "caret" + (isFolder ? "" : " empty");
  caret.textContent = "▶";

  const icon = document.createElement("span");
  icon.className = "icon";
  icon.textContent = isFolder ? "📁" : fileIcon(item.name);

  const label = document.createElement("span");
  label.className = "label";
  label.textContent = item.name;

  row.append(caret, icon, label);
  node.appendChild(row);

  const childrenWrap = document.createElement("div");
  childrenWrap.className = "children";
  childrenWrap.style.display = "none";
  node.appendChild(childrenWrap);

  let loaded = false;

  // 선택 + 폴더 펼침 / 파일 미리보기
  row.addEventListener("click", async (e) => {
    e.stopPropagation();
    selectItem(row, item);

    if (isFolder) {
      const open = childrenWrap.style.display === "block";
      childrenWrap.style.display = open ? "none" : "block";
      caret.textContent = open ? "▶" : "▼";
      if (!open && !loaded) {
        loaded = true;
        childrenWrap.innerHTML = '<div class="hint" style="padding:6px 10px">불러오는 중…</div>';
        try {
          const kids = await listChildren(item.id);
          childrenWrap.innerHTML = "";
          sortItems(kids).forEach(k => childrenWrap.appendChild(makeRow(k)));
        } catch (err) {
          childrenWrap.innerHTML = `<div class="hint" style="padding:6px 10px;color:var(--danger)">${err.message}</div>`;
        }
      }
    } else {
      openPreview(item);
    }
  });

  // 우클릭 컨텍스트 메뉴
  row.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    selectItem(row, item);
    showCtx(e.clientX, e.clientY, item);
  });

  return node;
}

function selectItem(row, item) {
  document.querySelectorAll(".row.selected").forEach(r => r.classList.remove("selected"));
  row.classList.add("selected");
  selectedItem = item;
}

function sortItems(items) {
  // 폴더 먼저, 그 다음 이름순
  return items.sort((a, b) => {
    const fa = a.folder ? 0 : 1, fb = b.folder ? 0 : 1;
    if (fa !== fb) return fa - fb;
    return a.name.localeCompare(b.name, "ko");
  });
}

function fileIcon(name) {
  const ext = (name.split(".").pop() || "").toLowerCase();
  if (["xlsx","xls","csv"].includes(ext)) return "📊";
  if (["doc","docx"].includes(ext)) return "📝";
  if (["pdf"].includes(ext)) return "📕";
  if (["dwg","dxf"].includes(ext)) return "📐";
  if (["png","jpg","jpeg","gif","webp"].includes(ext)) return "🖼️";
  return "📄";
}

async function loadTree() {
  treeEl.innerHTML = '<div class="hint" style="padding:10px">불러오는 중…</div>';
  try {
    if (!driveId) await resolveDrive();
    const items = await listChildren(null);
    treeEl.innerHTML = "";
    const root = document.createElement("div");
    root.className = "node";
    const head = document.createElement("div");
    head.className = "row";
    head.innerHTML = '<span class="caret">▼</span><span class="icon">📂</span><span class="label">전체 (루트)</span>';
    root.appendChild(head);
    const wrap = document.createElement("div");
    wrap.className = "children";
    sortItems(items).forEach(it => wrap.appendChild(makeRow(it)));
    root.appendChild(wrap);
    treeEl.appendChild(root);
  } catch (err) {
    treeEl.innerHTML = `<div class="hint" style="padding:10px;color:var(--danger)">로드 실패: ${err.message}</div>`;
  }
}

/* =========================================================
   5) 미리보기
   ========================================================= */
const previewEl = document.getElementById("preview");
function openPreview(item) {
  // SharePoint 웹 뷰어를 iframe으로
  previewEl.innerHTML = `<iframe src="${item.webUrl}"></iframe>`;
}

/* =========================================================
   6) 컨텍스트 메뉴 동작
   ========================================================= */
const ctx = document.getElementById("ctx");
let ctxItem = null;

function showCtx(x, y, item) {
  ctxItem = item;
  ctx.style.display = "block";
  // 화면 밖으로 안 나가게 보정
  const w = ctx.offsetWidth, h = ctx.offsetHeight;
  ctx.style.left = Math.min(x, window.innerWidth - w - 8) + "px";
  ctx.style.top = Math.min(y, window.innerHeight - h - 8) + "px";
}
function hideCtx() { ctx.style.display = "none"; }
document.addEventListener("click", hideCtx);
document.addEventListener("scroll", hideCtx, true);
window.addEventListener("resize", hideCtx);

ctx.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn || !ctxItem) return;
  const act = btn.dataset.act;
  if (act === "copylink")  copyInternalLink(ctxItem);
  else if (act === "download") downloadItem(ctxItem);
  else if (act === "mail")     openMailWithAttachment(ctxItem);
  else showToast("이 메뉴는 아직 연결되지 않았습니다: " + act, true);
});

/* ── 링크복사(내부): 핵심 기능 ── */
async function copyInternalLink(item) {
  const url = item?.webUrl;
  if (!url) { showToast("이 항목에는 링크 정보가 없습니다.", true); return; }

  try {
    await navigator.clipboard.writeText(url);   // HTTPS(GitHub Pages)에서 동작
    showToast("링크를 복사했습니다. 팀즈 채팅방에 붙여넣으세요.");
  } catch (e) {
    // 폴백: 구형 브라우저 / 비보안 컨텍스트
    const ta = document.createElement("textarea");
    ta.value = url;
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast("링크를 복사했습니다. 팀즈 채팅방에 붙여넣으세요.");
    } catch (err) {
      showToast("복사 실패 — 링크를 직접 복사하세요: " + url, true);
    } finally {
      document.body.removeChild(ta);
    }
  }
}

function downloadItem(item) {
  if (item.folder) { showToast("폴더는 다운로드할 수 없습니다.", true); return; }
  // @microsoft.graph.downloadUrl 을 받아 새 탭 열기
  graph(`/drives/${driveId}/items/${item.id}?$select=@microsoft.graph.downloadUrl`)
    .then(d => {
      const dl = d["@microsoft.graph.downloadUrl"];
      if (dl) window.open(dl, "_blank");
      else window.open(item.webUrl, "_blank");
    })
    .catch(() => window.open(item.webUrl, "_blank"));
}

function openMailWithAttachment(item) {
  // 간단 버전: 링크를 본문에 담아 메일 작성 창 호출
  const subject = encodeURIComponent(item.name);
  const body = encodeURIComponent("기술자료 링크: " + item.webUrl);
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

/* =========================================================
   7) 토스트
   ========================================================= */
const toastEl = document.getElementById("toast");
let toastTimer = null;
function showToast(msg, isError = false) {
  toastEl.textContent = msg;
  toastEl.className = "toast show" + (isError ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = "toast"; }, 2600);
}

/* =========================================================
   8) 검색 (이름 필터)
   ========================================================= */
document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll("#tree .node").forEach(node => {
    const label = node.querySelector(".label")?.textContent?.toLowerCase() || "";
    const match = !q || label.includes(q);
    const row = node.querySelector(".row");
    if (row) row.style.display = match ? "" : "none";
  });
});

/* =========================================================
   9) 초기화
   ========================================================= */
const gate = document.getElementById("gate");
const app = document.getElementById("app");

function enterApp() {
  gate.style.display = "none";
  app.style.display = "block";
  loadTree();
}

document.getElementById("loginBtn").addEventListener("click", async () => {
  try {
    const r = await msal.loginPopup({ scopes: CONFIG.scopes });
    account = r.account;
    msal.setActiveAccount(account);
    enterApp();
  } catch (e) {
    showToast("로그인 실패: " + e.message, true);
  }
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  msal.logoutPopup();
});
document.getElementById("refreshBtn").addEventListener("click", () => {
  driveId = null; loadTree();
});

// 페이지 로드 시 기존 세션 복구
(async function init() {
  await msal.initialize();
  const accts = msal.getAllAccounts();
  if (accts.length) {
    account = accts[0];
    msal.setActiveAccount(account);
    enterApp();
  }
})();
</script>
</body>
</html>
